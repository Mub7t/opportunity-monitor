name: Bahr Project Monitor v3

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 4. Run monitor ───────────────────────────────────────────────────────
      - name: Run monitor
        env:
          # Email
          EMAIL_ENABLED:      ${{ secrets.EMAIL_ENABLED }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:     ${{ secrets.EMAIL_RECEIVER }}
          # Telegram
          TELEGRAM_ENABLED:   ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # AI
          AI_ENABLED:         ${{ secrets.AI_ENABLED }}
          AI_PROVIDER:        ${{ secrets.AI_PROVIDER }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL:           ${{ secrets.AI_MODEL }}
          # Thresholds (tiered)
          MIN_NOTIFY_SCORE:   ${{ secrets.MIN_NOTIFY_SCORE }}
          HIGH_PRIORITY_SCORE: ${{ secrets.HIGH_PRIORITY_SCORE }}
          GOLDEN_SCORE:       ${{ secrets.GOLDEN_SCORE }}
          GOLDEN_MIN_SCORE:   ${{ secrets.GOLDEN_MIN_SCORE }}
          GOLDEN_MIN_WIN_PCT: ${{ secrets.GOLDEN_MIN_WIN_PCT }}
          # Scraping
          MAX_SCROLL_STEPS:   ${{ secrets.MAX_SCROLL_STEPS }}
          SCRAPE_MAX_RETRIES: ${{ secrets.SCRAPE_MAX_RETRIES }}
          # Profile
          PROFILE_NAME:       ${{ secrets.PROFILE_NAME }}
          PROFILE_TITLE:      ${{ secrets.PROFILE_TITLE }}
          PROFILE_SKILLS:     ${{ secrets.PROFILE_SKILLS }}
          PROFILE_EXPERIENCE: ${{ secrets.PROFILE_EXPERIENCE }}
          PROFILE_PORTFOLIO:  ${{ secrets.PROFILE_PORTFOLIO }}
          PROFILE_CONTACT:    ${{ secrets.PROFILE_CONTACT }}
        run: python monitor.py

      # ── 5. Commit persistent data files ──────────────────────────────────────
      # Commits seen_ids.json, projects.db, preferences.json, market_report.json
      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json projects.db preferences.json market_report.json || true
          git diff --staged --quiet || git commit -m "chore: update data files [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
